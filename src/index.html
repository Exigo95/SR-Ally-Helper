<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verbündeten-Schmiede – SR5</title>
  <meta name="description" content="Verbündetengeister für Shadowrun 5 erstellen – Karma, Kräfte, Werteblock und Ritualproben.">
  <meta name="theme-color" content="#0d0f14">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="sigil" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 3 L27.3 22.5 L4.7 22.5 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M16 29 L4.7 9.5 L27.3 9.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="brand-title">Verbündeten-Schmiede</div>
        <div class="brand-sub">Shadowrun 5 · Verbündetengeister nach Straßengrimoire</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnNew" title="Neuen Verbündeten anlegen">Neu</button>
      <button class="btn ghost" id="btnLoad" title="Verbündeten aus JSON-Datei laden">Laden</button>
      <button class="btn ghost" id="btnSave" title="Als JSON-Datei speichern">Speichern</button>
      <button class="btn ghost" id="btnLink" title="Link mit allen aktuellen Einstellungen kopieren">Link teilen</button>
      <button class="btn ghost" id="btnCopy" title="Werteblock als Text kopieren">Text kopieren</button>
      <button class="btn primary" id="btnPrint" title="Drucken oder als PDF speichern">Drucken / PDF</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" id="steps"></nav>
    <main class="view" id="view"></main>
    <aside class="summary" id="summary"></aside>
  </div>

  <div class="toast" id="toast"></div>
  <div id="printArea"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
